<title>Rulex Arcade</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#111;--line:#292929;--text:#f5f5f5;--muted:#aaa;--accent:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}
#intro{position:fixed;inset:0;background:#000;z-index:20;display:flex;align-items:center;justify-content:center;transition:opacity 1s ease;opacity:1}
#brand{position:absolute;left:calc(50% + 50px);top:50%;transform:translate(-50%,-50%);width:min(420px,80vw);max-height:50vh;object-fit:contain;transition:all 1.2s ease}
#loading{position:absolute;left:calc(50% + 30px);top:calc(50% + 133px);width:min(320px,65vw);height:6px;background:#242424;border-radius:8px;overflow:hidden;opacity:0;transition:opacity .4s}
#loadFill{height:100%;width:0;background:#fff;border-radius:8px}
#intro.done{opacity:0;pointer-events:none}#intro.done #brand{left:0;top:0;transform:translate(20px,20px);width:100px;max-height:70px}
#intro.done #loading{opacity:0}
#app{min-height:100vh;padding:24px 28px 100px;opacity:0;transition:opacity .7s}#app.ready{opacity:1}
header{display:flex;align-items:center;gap:16px;min-height:72px}#smallLogo{width:100px;height:64px;object-fit:contain;visibility:hidden}header h1{font-size:clamp(25px,4vw,38px);margin:0;font-weight:800;letter-spacing:-1px}header .sub{color:var(--muted);font-size:13px;margin-top:5px}
#menu{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10;background:#121212;border:1px solid #303030;padding:10px 12px;border-radius:18px;box-shadow:0 8px 30px #000a}
.menuBtn{width:48px;height:48px;border:0;border-radius:12px;background:#f4f4f4;color:#050505;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s}.menuBtn:hover{transform:translateY(-2px);background:#ddd}.menuBtn svg{width:23px;height:23px;fill:currentColor}
#gallery{display:none;margin-top:25px}#gallery.show{display:block}.galleryTop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.galleryTop h2{margin:0;font-size:25px}.galleryTop input{background:#111;border:1px solid #333;border-radius:10px;color:white;padding:12px 14px;min-width:min(280px,100%);font-size:14px;outline:none}.galleryTop input:focus{border-color:#888}
#gameGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:17px}.game{border:1px solid #262626;background:#101010;border-radius:13px;overflow:hidden;cursor:pointer;transition:transform .16s,border-color .16s;min-width:0}.game:hover{transform:translateY(-4px);border-color:#777}.game img{width:100%;height:120px;display:block;object-fit:cover;background:#222}.game .gameName{font-size:14px;font-weight:700;padding:12px 12px 14px;line-height:1.3}.empty{color:#aaa;padding:30px 0}
#playerPanel{margin-top:26px}#playerPanel[hidden]{display:none}.playerTop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.playerTop h2{margin:0;font-size:22px}.playerActions{display:flex;gap:8px;flex-wrap:wrap}.playerActions button{background:#171717;border:1px solid #444;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700}.playerActions button:hover{background:#252525}#playerFrameWrap{width:100%;height:min(72vh,760px);min-height:360px;background:#000;border:1px solid #333;border-radius:12px;overflow:hidden}#gameFrame{width:100%;height:100%;border:0;background:#000}.embedNote{color:#aaa;font-size:13px;margin-top:10px}
@media(max-width:600px){#app{padding:14px 14px 100px}#gameGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.game img{height:105px}.game .gameName{padding:10px;font-size:13px}#brand{left:50%;}}
</style>
</head>

const intro=document.getElementById('intro'),fill=document.getElementById('loadFill'),app=document.getElementById('app');
const gallery=document.getElementById('gallery'),grid=document.getElementById('gameGrid'),search=document.getElementById('search'),empty=document.getElementById('empty');
function renderGames(term=''){const filtered=games.filter(g=>!g.hide && g.name.toLowerCase().includes(term.trim().toLowerCase()));grid.innerHTML='';filtered.forEach(g=>{const card=document.createElement('article');card.className='game';card.tabIndex=0;card.setAttribute('role','link');card.setAttribute('aria-label','Play '+g.name);const img=document.createElement('img');img.src=g.image;img.alt='';img.loading='lazy';img.onerror=()=>{img.style.display='none'};const name=document.createElement('div');name.className='gameName';name.textContent=g.name;card.append(img,name);const open=()=>openGame(g);card.addEventListener('click',open);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});grid.append(card)});empty.hidden=filtered.length>0}
function showGames(){gallery.hidden=false;gallery.classList.add('show');renderGames(search.value);gallery.scrollIntoView({behavior:'smooth',block:'start'})}
function openGame(game){
  if(!game || !game.link) return;
  let url;
  try { url = new URL(game.link, window.location.href); } catch { return; }
  if(url.protocol !== 'https:' && url.protocol !== 'http:') return;
  const panel=document.getElementById('playerPanel');
  const frame=document.getElementById('gameFrame');
  document.getElementById('playerTitle').textContent=game.name;
  document.getElementById('embedNote').hidden=false;
  frame.src=url.href;
  panel.hidden=false;
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}
function closeGame(){
  document.getElementById('gameFrame').src='about:blank';
  document.getElementById('playerPanel').hidden=true;
  gallery.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('closeGameBtn').addEventListener('click',closeGame);
document.getElementById('fullscreenBtn').addEventListener('click',()=>{
  const target=document.getElementById('playerFrameWrap');
  if(target.requestFullscreen) target.requestFullscreen().catch(()=>{});
  else if(target.webkitRequestFullscreen) target.webkitRequestFullscreen();
});
document.getElementById('playBtn').addEventListener('click',showGames);search.addEventListener('input',()=>renderGames(search.value));
 document.getElementById('settingsBtn').addEventListener('click',()=>{const audio=document.getElementById('startupAudio');audio.muted=!audio.muted;document.getElementById('settingsBtn').setAttribute('aria-label',audio.muted?'Turn sound on':'Turn sound off')});
// Keep the branded intro, while ensuring the app is never stuck if window load is delayed.
function beginIntro(){
  const loading=document.getElementById('loading');
  const audio=document.getElementById('startupAudio');
  // The loading bar fades in and fills during the intro.
  setTimeout(()=>{loading.style.opacity='1';fill.style.transition='width 3.5s ease';fill.style.width='100%';},900);
  // Startup sound cue; browser autoplay may require a prior interaction.
  setTimeout(()=>{audio.volume=.55;audio.play().catch(()=>{});},4000);
  // Move the logo to the upper-left and reveal the site content.
  setTimeout(()=>{
    document.getElementById('brand').style.left='0';
    document.getElementById('brand').style.top='0';
    document.getElementById('brand').style.transform='translate(20px,20px)';
    document.getElementById('brand').style.width='100px';
    document.getElementById('brand').style.maxHeight='70px';
    document.getElementById('smallLogo').style.visibility='visible';
    app.classList.add('ready');
  },8000);
  // Fade the intro overlay only after the logo has had time to move.
  setTimeout(()=>{intro.classList.add('done');},9500);
}
renderGames('');
beginIntro();
