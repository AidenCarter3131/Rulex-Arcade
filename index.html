<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rulex Arcade</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#111;--line:#292929;--text:#f5f5f5;--muted:#aaa;--accent:#fff}
*{box-sizing:border-box}

/* Dark Grey/Black Flowing Line Pattern Background */
html,body{margin:0;min-height:100%;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{
  overflow-x:hidden;
  background-color: #050505;
  background-image: 
    linear-gradient(90deg, rgba(40,40,40,0.4) 1px, transparent 1px),
    linear-gradient(rgba(40,40,40,0.4) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: flowLines 12s linear infinite;
}
@keyframes flowLines {
  0% { background-position: 0 0; }
  100% { background-position: 40px 80px; }
}

/* Click to Start Overlay */
#startScreen {
  position:fixed; inset:0; background:#000; z-index:50; display:flex; align-items:center; justify-content:center;
}
#startBtn {
  background:#fff; color:#000; border:none; padding:16px 32px; font-size:20px; font-weight:bold; border-radius:12px; cursor:pointer; transition:transform 0.2s;
}
#startBtn:hover { transform:scale(1.05); }

#intro{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;transition:opacity 1s ease;opacity:1}
#brand{position:absolute;left:calc(50% + 20px);top:50%;transform:translate(-50%,-50%);width:min(420px,80vw);max-height:50vh;object-fit:contain;transition:all 1.2s ease}
#loading{position:absolute;left:calc(50% + 10px);top:calc(50% + 133px);width:min(320px,65vw);height:6px;background:#242424;border-radius:8px;overflow:hidden;opacity:0;transition:opacity .4s}
#loadFill{height:100%;width:0;background:#fff;border-radius:8px}
#intro.done{opacity:0;pointer-events:none}#intro.done #brand{left:0;top:0;transform:translate(20px,20px);width:100px;max-height:70px}
#intro.done #loading{opacity:0}
#app{min-height:100vh;padding:24px 28px 100px;opacity:0;transition:opacity .7s}#app.ready{opacity:1}
header{display:flex;align-items:center;gap:16px;min-height:72px}#smallLogo{width:100px;height:64px;object-fit:contain;visibility:hidden}header h1{font-size:clamp(25px,4vw,38px);margin:0;font-weight:800;letter-spacing:-1px}header .sub{color:var(--muted);font-size:13px;margin-top:5px}

/* Menu & Buttons */
#menu{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10;background:#121212;border:1px solid #303030;padding:10px 12px;border-radius:18px;box-shadow:0 8px 30px #000a}
.menuBtn{width:48px;height:48px;border:0;border-radius:12px;background:#f4f4f4;color:#050505;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s,color .15s}.menuBtn:hover{transform:translateY(-2px);background:#ddd}.menuBtn svg{width:23px;height:23px;fill:currentColor}
.menuBtn.active{background:#ffc107; color:#000}

/* Tags / Categories */
.tags{display:flex;gap:8px;overflow-x:auto;margin:16px 0;padding-bottom:6px;scrollbar-width:none}
.tags::-webkit-scrollbar{display:none}
.tag{background:#171717;border:1px solid #333;color:#ccc;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;transition:all .15s}
.tag.active, .tag:hover{background:#eee;color:#000;border-color:#eee}
.tag[data-cat="Favorites"].active{background:#ff4757;color:#fff;border-color:#ff4757}

/* Gallery & Grid */
#gallery{display:none;margin-top:15px}#gallery.show{display:block}.galleryTop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.galleryTop h2{margin:0;font-size:25px}.galleryTop input{background:#111;border:1px solid #333;border-radius:10px;color:white;padding:12px 14px;min-width:min(280px,100%);font-size:14px;outline:none;transition:border-color .2s}.galleryTop input:focus{border-color:#888}
#gameGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:17px}.game{position:relative;border:1px solid #262626;background:#101010;border-radius:13px;overflow:hidden;cursor:pointer;transition:transform .16s,border-color .16s;min-width:0}.game:hover{transform:translateY(-4px);border-color:#777}.game img{width:100%;height:120px;display:block;object-fit:cover;background:#222;pointer-events:none}.game .gameName{font-size:14px;font-weight:700;padding:12px 12px 14px;line-height:1.3;pointer-events:none}.empty{color:#aaa;padding:30px 0}

/* Favorite Button */
.favBtn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);border:none;color:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;display:grid;place-items:center;z-index:2;transition:transform .2s;line-height:1}
.favBtn.active{color:#ff4757}
.favBtn:hover{transform:scale(1.15);background:rgba(0,0,0,0.85)}

/* Player Panel */
#playerPanel{margin-top:26px}#playerPanel[hidden]{display:none}.playerTop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.playerTop h2{margin:0;font-size:22px}.playerActions{display:flex;gap:8px;flex-wrap:wrap}.playerActions button{background:#171717;border:1px solid #444;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700}.playerActions button:hover{background:#252525}#playerFrameWrap{width:100%;height:min(72vh,760px);min-height:360px;background:#000;border:1px solid #333;border-radius:12px;overflow:hidden}#gameFrame{width:100%;height:100%;border:0;background:#000}.embedNote{color:#aaa;font-size:13px;margin-top:10px}

/* Low-End Performance Mode */
body.low-end { animation: none !important; background-image: none !important; background: var(--bg) !important; }
body.low-end * {transition:none !important;box-shadow:none !important}
body.low-end .game:hover {transform:none !important}
body.low-end .favBtn {backdrop-filter:none !important;background:#000}

@media(max-width:600px){#app{padding:14px 14px 100px}#gameGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.game img{height:105px}.game .gameName{padding:10px;font-size:13px}#brand{left:50%;}}
</style>
</head>
<body>

<div id="startScreen">
  <button id="startBtn">Enter Rulex Arcade</button>
</div>

<div id="intro" aria-label="Rulex Arcade loading screen">
  <img id="brand" src="https://aidencarter3131.github.io/Rulex-Arcade/R-11-7-2026.png" alt="Rulex Arcade logo">
  <div id="loading"><div id="loadFill"></div></div>
</div>

<main id="app">
  <header>
    <img id="smallLogo" src="https://aidencarter3131.github.io/Rulex-Arcade/R-11-7-2026.png" alt="">
    <div><h1>Rulex Arcade</h1><div class="sub">Pick a game and have fun.</div></div>
  </header>

  <section id="gallery" aria-label="Game library">
    <div class="galleryTop">
      <h2>Games</h2>
      <input id="search" type="search" placeholder="Search games…" aria-label="Search games">
    </div>
    <div class="tags" id="categoryTags">
      <button class="tag active" data-cat="All">All</button>
      <button class="tag" data-cat="Favorites">Favorites ♥</button>
      <button class="tag" data-cat="Sports">Sports</button>
      <button class="tag" data-cat="Action">Action</button>
      <button class="tag" data-cat="Rhythm">Rhythm</button>
      <button class="tag" data-cat="Casual">Casual</button>
    </div>
    <div id="gameGrid"></div>
    <div id="empty" class="empty" hidden>No games found.</div>
  </section>

  <section id="playerPanel" aria-label="Game player" hidden>
    <div class="playerTop">
      <h2 id="playerTitle">Game</h2>
      <div class="playerActions">
        <button id="fullscreenBtn" type="button">⛶ Fullscreen</button>
        <button id="closeGameBtn" type="button">✕ Back to games</button>
      </div>
    </div>
    <div id="playerFrameWrap">
      <iframe id="gameFrame" title="Game player" allow="autoplay; fullscreen; gamepad" allowfullscreen referrerpolicy="no-referrer"></iframe>
    </div>
    <p id="embedNote" class="embedNote" hidden>This game’s host may block being embedded. If it does not load here, that game may not support in-page play.</p>
  </section>
</main>

<nav id="menu" aria-label="Main menu">
  <button class="menuBtn" id="playBtn" title="Play" aria-label="Show games">
    <svg viewBox="0 0 24 24"><path d="M7 4.8c0-.8.9-1.3 1.6-.9l11 6.6a1.7 1.7 0 0 1 0 2.9l-11 6.6c-.7.4-1.6-.1-1.6-.9V4.8z"/></svg>
  </button>
  <button class="menuBtn" id="settingsBtn" title="Toggle sound" aria-label="Toggle sound">
    <svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.5-2-3.5-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7.8 7.8 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7.7 7.7 0 0 0 1.7 1L11 21h4l.4-2.9a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.5-2.1-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
  </button>
  <button class="menuBtn" id="perfBtn" title="Performance Mode" aria-label="Toggle performance mode">
    <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7v7l9-11h-7V3z"/></svg>
  </button>
</nav>

// Start Screen (Fixes Audio Block)
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('intro').style.display = 'flex';
  beginIntro();
});

// DOM Elements
const intro=document.getElementById('intro'), fill=document.getElementById('loadFill'), app=document.getElementById('app');
const gallery=document.getElementById('gallery'), grid=document.getElementById('gameGrid'), search=document.getElementById('search'), empty=document.getElementById('empty');
const perfBtn=document.getElementById('perfBtn'), catTags=document.getElementById('categoryTags');

// State
let favs = JSON.parse(localStorage.getItem('rulex_favs') || '[]');
let currentCat = 'All';
let isPerfMode = localStorage.getItem('rulex_perf') === 'true';

// Auto-categorize games to power the tags filter
const sportsKeywords = ['basket', 'soccer', 'volley', 'football', 'boxing', 'baseball', 'wrestle', 'retro bowl', 'ping pong', 'free kick', 'sports'];
const rhythmKeywords = ['friday night', 'funkin', 'bad time'];
const casualKeywords = ['candy crush', 'fruit ninja', 'run', 'slope', 'crossy road', 'hole.io', 'stack', 'dinosaur', 'jetpack'];

games.forEach(g => {
  const n = g.name.toLowerCase();
  if (sportsKeywords.some(k => n.includes(k))) g.category = 'Sports';
  else if (rhythmKeywords.some(k => n.includes(k))) g.category = 'Rhythm';
  else if (casualKeywords.some(k => n.includes(k))) g.category = 'Casual';
  else g.category = 'Action';
});

// Setup Performance Mode
if(isPerfMode) { 
  document.body.classList.add('low-end'); 
  perfBtn.classList.add('active'); 
  currentCat = 'Favorites'; 
}

// Render Games
function renderGames() {
  const term = search.value.trim().toLowerCase();
  const filtered = games.filter(g => {
    if(g.hide) return false;
    const matchesSearch = g.name.toLowerCase().includes(term);
    const matchesCat = currentCat === 'All' ? true : 
                       currentCat === 'Favorites' ? favs.includes(g.name) : 
                       g.category === currentCat;
    return matchesSearch && matchesCat;
  });

  grid.innerHTML = filtered.map(g => `
    <article class="game" tabindex="0" role="link" aria-label="Play ${g.name}" data-name="${g.name}">
      <button class="favBtn ${favs.includes(g.name) ? 'active' : ''}" data-name="${g.name}" aria-label="Favorite">
        ${favs.includes(g.name) ? '♥' : '♡'}
      </button>
      <img src="${g.image}" alt="" loading="lazy" onerror="this.style.display='none'">
      <div class="gameName">${g.name}</div>
    </article>
  `).join('');

  empty.hidden = filtered.length > 0;
  
  // Sync tag UI
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
  const activeTag = document.querySelector(`.tag[data-cat="${currentCat}"]`);
  if(activeTag) activeTag.classList.add('active');
}

// Event Delegation for Grid (Clicks on cards or favorites)
grid.addEventListener('click', (e) => {
  const favBtn = e.target.closest('.favBtn');
  if (favBtn) {
    const name = favBtn.dataset.name;
    if (favs.includes(name)) favs = favs.filter(f => f !== name);
    else favs.push(name);
    localStorage.setItem('rulex_favs', JSON.stringify(favs));
    
    favBtn.textContent = favs.includes(name) ? '♥' : '♡';
    favBtn.classList.toggle('active', favs.includes(name));
    if (currentCat === 'Favorites' && !favs.includes(name)) renderGames(); 
    return;
  }
  
  const card = e.target.closest('.game');
  if (card) {
    const game = games.find(g => g.name === card.dataset.name);
    if (game) openGame(game);
  }
});

// Category Tag Switching
catTags.addEventListener('click', (e) => {
  if(e.target.classList.contains('tag')) {
    currentCat = e.target.dataset.cat;
    renderGames();
  }
});

// Search Debounce
let searchTimeout;
search.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(renderGames, 250);
});

function showGames(){
  gallery.hidden=false; gallery.classList.add('show');
  renderGames(); gallery.scrollIntoView({behavior:'smooth',block:'start'});
}

function openGame(game){
  if(!game || !game.link) return;
  
  const panel=document.getElementById('playerPanel');
  const frame=document.getElementById('gameFrame');
  document.getElementById('playerTitle').textContent=game.name;
  document.getElementById('embedNote').hidden=false;
  
  if (game.link === 'custom_sonic_cd') {
    frame.srcdoc = sonicCdHtml;
  } else {
    let url;
    try { 
      url = new URL(game.link, window.location.href); 
    } catch { 
      return; 
    }
    frame.removeAttribute('srcdoc');
    frame.src = url.href;
  }
  
  panel.hidden=false;
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}

function closeGame(){
  const frame=document.getElementById('gameFrame');
  frame.src='about:blank';
  frame.removeAttribute('srcdoc');
  document.getElementById('playerPanel').hidden=true;
  gallery.scrollIntoView({behavior:'smooth',block:'start'});
}

// Button Events
document.getElementById('closeGameBtn').addEventListener('click',closeGame);
document.getElementById('fullscreenBtn').addEventListener('click',()=>{
  const target=document.getElementById('playerFrameWrap');
  if(target.requestFullscreen) target.requestFullscreen().catch(()=>{});
  else if(target.webkitRequestFullscreen) target.webkitRequestFullscreen();
});
document.getElementById('playBtn').addEventListener('click',showGames);

document.getElementById('settingsBtn').addEventListener('click',()=>{
  const audio=document.getElementById('startupAudio');
  audio.muted=!audio.muted;
  document.getElementById('settingsBtn').classList.toggle('active', !audio.muted);
});

// Performance / Favorites Toggle
perfBtn.addEventListener('click', () => {
  isPerfMode = !isPerfMode;
  document.body.classList.toggle('low-end', isPerfMode);
  perfBtn.classList.toggle('active', isPerfMode);
  localStorage.setItem('rulex_perf', isPerfMode);
  
  if (isPerfMode) {
    currentCat = 'Favorites';
    renderGames();
  }
});

// Intro Sequence
function beginIntro(){
  const loading=document.getElementById('loading');
  const audio=document.getElementById('startupAudio');
  setTimeout(()=>{loading.style.opacity='1';fill.style.transition='width 3.5s ease';fill.style.width='100%';},900);
  setTimeout(()=>{audio.volume=.55;audio.play().catch(()=>{});},4000);
  setTimeout(()=>{
    document.getElementById('brand').style.left='0';
    document.getElementById('brand').style.top='0';
    document.getElementById('brand').style.transform='translate(20px,20px)';
    document.getElementById('brand').style.width='100px';
    document.getElementById('brand').style.maxHeight='70px';
    document.getElementById('smallLogo').style.visibility='visible';
    app.classList.add('ready');
    renderGames();
  },8000);
  setTimeout(()=>{intro.classList.add('done');},9500);
}
</script>
