<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rulex's Arcade</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Starts completely hidden on a black screen */
        .loading-screen {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Appears after 3 seconds */
        .loading-screen.show {
            opacity: 1;
        }

        .logo {
            width: min(420px, 80vw);
            max-height: 50vh;
            object-fit: contain;
            margin-bottom: 30px;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Loading bar background */
        .loading-container {
            width: min(350px, 75vw);
            height: 18px;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        }

        /* Loading progress */
        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffffff, #a8a8a8);
            border-radius: 10px;
        }

        .loading-screen.show .loading-bar {
            animation: load 4s ease-in-out forwards;
        }

        @keyframes load {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }

        .loading-text {
            margin-top: 12px;
            color: #ffffff;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- Loading screen -->
    <main class="loading-screen" id="loadingScreen">
        <img
            class="logo"
            src="https://aidencarter3131.github.io/Rulex-Arcade/R-11-7-2026.png"
            alt="Rulex's Arcade"
        >

        <div class="loading-container">
            <div class="loading-bar"></div>
        </div>

        <p class="loading-text">Loading...</p>
    </main>

    <!-- Startup sound -->
    <audio
        id="startupSound"
        preload="auto"
        src="https://aidencarter3131.github.io/Rulex-Arcade/Microsoft%20Windows%20Vista%20Startup%20Sound.mp3">
    </audio>

    <script>
        // Keep the screen black for 3 seconds.
        setTimeout(() => {
            // Show the image and loading bar.
            document.getElementById("loadingScreen").classList.add("show");

            // Play the startup sound at the same time.
            const startupSound = document.getElementById("startupSound");
            startupSound.play().catch(() => {
                console.log("Sound playback was blocked by the browser.");
            });

        }, 3000);
    </script>

</body>
</html>
