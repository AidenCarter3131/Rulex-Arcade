<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rulex Arcade 🎄 Christmas Edition</title>
<style>
:root {
  --bg-color: #70a1ff;
  --panel-bg: rgba(20, 25, 40, 0.75);
  --panel-border: rgba(255, 255, 255, 0.18);
  --card-bg: rgba(30, 38, 56, 0.85);
  --card-hover: rgba(45, 56, 82, 0.95);
  --accent: #ff4757;
  --accent-gold: #ffa502;
  --accent-green: #2ed573;
  --text-main: #ffffff;
  --text-muted: #dcdde1;
}

*{box-sizing:border-box}

/* Smooth 10-Second Light Blue <-> Grey Background Transition */
html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  color: var(--text-main);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow-x: hidden;
  animation: christmasBgTransition 10s ease-in-out infinite;
}

@keyframes christmasBgTransition {
  0%, 100% {
    background-color: #5352ed; /* Light Winter Blue */
  }
  50% {
    background-color: #57606f; /* Cool Winter Grey */
  }
}

/* Snowfall Canvas Overlay */
#snowCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 2;
}

/* App Container */
#app {
  position: relative;
  z-index: 3;
  min-height: 100vh;
  padding: 24px 28px 120px;
  max-width: 1400px;
  margin: 0 auto;
}

/* Header & Banner */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 24px;
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand-section img {
  width: 64px;
  height: 64px;
  object-fit: contain;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
}

header h1 {
  font-size: clamp(22px, 3.5vw, 32px);
  margin: 0;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(45deg, #ffffff, #ff4757, #ffa502);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

header .sub {
  color: var(--text-muted);
  font-size: 13px;
  margin-top: 4px;
  font-weight: 500;
}

/* Gallery Toolbar */
.galleryTop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.galleryTop h2 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-bar-wrap {
  display: flex;
  gap: 10px;
  flex: 1;
  max-width: 450px;
}

.galleryTop input {
  width: 100%;
  background: var(--panel-bg);
  backdrop-filter: blur(8px);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  color: white;
  padding: 12px 18px;
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
}

.galleryTop input:focus {
  border-color: var(--accent-gold);
  box-shadow: 0 0 12px rgba(255, 165, 2, 0.4);
}

.random-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-gold));
  border: none;
  color: #fff;
  font-weight: 700;
  padding: 0 18px;
  border-radius: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.2s, box-shadow 0.2s;
}

.random-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(255, 71, 87, 0.4);
}

/* Category Filter Tags */
.tags {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  margin: 18px 0 24px;
  padding-bottom: 6px;
  scrollbar-width: none;
}
.tags::-webkit-scrollbar { display: none; }

.tag {
  background: var(--panel-bg);
  backdrop-filter: blur(8px);
  border: 1px solid var(--panel-border);
  color: var(--text-muted);
  padding: 8px 18px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s;
}

.tag.active, .tag:hover {
  background: #ffffff;
  color: #111;
  border-color: #ffffff;
  transform: translateY(-1px);
}

.tag[data-cat="Favorites"].active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* Game Grid */
#gameGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 18px;
}

.game {
  position: relative;
  border: 1px solid var(--panel-border);
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.game:hover {
  transform: translateY(-5px);
  border-color: var(--accent-gold);
  box-shadow: 0 10px 24px rgba(0,0,0,0.4);
  background: var(--card-hover);
}

.game img {
  width: 100%;
  height: 125px;
  display: block;
  object-fit: cover;
  background: #151821;
}

.game .gameName {
  font-size: 14px;
  font-weight: 700;
  padding: 12px 14px 14px;
  line-height: 1.3;
}

.favBtn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  cursor: pointer;
  font-size: 16px;
  display: grid;
  place-items: center;
  z-index: 2;
  transition: transform 0.2s, background 0.2s;
}

.favBtn.active {
  color: var(--accent);
  background: rgba(255,255,255,0.9);
}

.favBtn:hover {
  transform: scale(1.15);
}

/* Player Panel */
#playerPanel {
  margin-top: 24px;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}

.playerTop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.playerTop h2 {
  margin: 0;
  font-size: 22px;
  color: #fff;
}

.playerActions {
  display: flex;
  gap: 10px;
}

.playerActions button {
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--panel-border);
  color: #fff;
  border-radius: 10px;
  padding: 10px 16px;
  cursor: pointer;
  font-weight: 700;
  transition: all 0.2s;
}

.playerActions button:hover {
  background: rgba(255,255,255,0.25);
  transform: translateY(-1px);
}

#playerFrameWrap {
  width: 100%;
  height: min(75vh, 800px);
  min-height: 400px;
  background: #000;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}

#gameFrame {
  width: 100%;
  height: 100%;
  border: 0;
}

/* Bottom Nav Menu */
#menu {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 14px;
  z-index: 100;
  background: rgba(18, 22, 33, 0.85);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 10px 16px;
  border-radius: 24px;
  box-shadow: 0 12px 36px rgba(0,0,0,0.5);
}

.menuBtn {
  width: 50px;
  height: 50px;
  border: 0;
  border-radius: 14px;
  background: rgba(255,255,255,0.9);
  color: #111;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s;
}

.menuBtn:hover {
  transform: translateY(-3px) scale(1.05);
  background: #ffffff;
  box-shadow: 0 6px 16px rgba(255,255,255,0.3);
}

.menuBtn.active {
  background: var(--accent-gold);
  color: #000;
}

.menuBtn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

/* Functional Settings Modal */
#settingsModal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

#settingsModal.open {
  opacity: 1;
  pointer-events: auto;
}

.modalCard {
  background: #191e2b;
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 28px;
  width: min(480px, 90vw);
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
}

.modalHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modalHeader h3 {
  margin: 0;
  font-size: 22px;
  color: #fff;
}

.closeModalBtn {
  background: none;
  border: none;
  color: #aaa;
  font-size: 24px;
  cursor: pointer;
}

.settingRow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.settingRow label {
  font-weight: 600;
  font-size: 15px;
}

/* Custom Toggle Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 46px;
  height: 24px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #333;
  transition: .2s;
  border-radius: 24px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: .2s;
  border-radius: 50%;
}

input:checked + .slider { background-color: var(--accent-green); }
input:checked + .slider:before { transform: translateX(22px); }

/* Toast Notifications */
#toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(18, 22, 33, 0.95);
  border: 1px solid var(--panel-border);
  color: #fff;
  padding: 10px 20px;
  border-radius: 30px;
  font-weight: 600;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease;
  z-index: 200;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Performance Mode Override */
body.low-end {
  animation: none !important;
  background: #3a4754 !important;
}
body.low-end #snowCanvas { display: none !important; }
body.low-end * { transition: none !important; }
</style>

<body>

<!-- Snowfall Effect Canvas -->
<canvas id="snowCanvas"></canvas>

<!-- App Content -->
<main id="app">
  <header>

</main>

  <button class="menuBtn" id="settingsBtn" title="Settings">

  </button>
</nav>

<!-- Functional Settings Modal -->
<div id="settingsModal">
  <div class="modalCard">
    <div class="modalHeader">
      <h3>⚙️ Arcade Settings</h3>
      <button class="closeModalBtn" id="closeSettingsModal">&times;</button>
    </div>
    <div class="settingRow">
      <label for="snowToggle">❄️ Falling Snowfall</label>
      <label class="switch">
        <input type="checkbox" id="snowToggle" checked>
        <span class="slider"></span>
      </label>

    </div>
  </div>
</div>

<!-- Toast Popup -->

// Render Games Grid
function renderGames() {
  const term = search.value.trim().toLowerCase();
  const filtered = games.filter(g => {
    const matchesSearch = g.name.toLowerCase().includes(term);
    const matchesCat = currentCat === 'All' ? true :
                       currentCat === 'Favorites' ? favs.includes(g.name) :
                       g.category === currentCat;
    return matchesSearch && matchesCat;
  });

  grid.innerHTML = filtered.map(g => `
    <article class="game" data-name="${g.name}">
      <button class="favBtn ${favs.includes(g.name) ? 'active' : ''}" data-name="${g.name}">
        ${favs.includes(g.name) ? '♥' : '♡'}
      </button>
      <img src="${g.image}" alt="${g.name}" loading="lazy">
      <div class="gameName">${g.name}</div>
    </article>
  `).join('');

  empty.hidden = filtered.length > 0;
}

// Toast Popup
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Grid Clicks (Open Game or Favorite)
grid.addEventListener('click', (e) => {
  const favBtn = e.target.closest('.favBtn');
  if (favBtn) {
    const name = favBtn.dataset.name;
    if (favs.includes(name)) {
      favs = favs.filter(f => f !== name);
      showToast(`Removed "${name}" from Favorites`);
    } else {
      favs.push(name);
      showToast(`Added "${name}" to Favorites ♥`);
    }
    localStorage.setItem('rulex_favs', JSON.stringify(favs));
    renderGames();
    return;
  }

  const card = e.target.closest('.game');
  if (card) {
    const game = games.find(g => g.name === card.dataset.name);
    if (game) openGame(game);
  }
});

// Category Tag Switching
document.getElementById('categoryTags').addEventListener('click', (e) => {
  if(e.target.classList.contains('tag')) {
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentCat = e.target.dataset.cat;
    renderGames();
  }
});

// Search Filter
search.addEventListener('input', renderGames);

// Surprise Me (Random Game) Button
document.getElementById('randomBtn').addEventListener('click', () => {
  const randomGame = games[Math.floor(Math.random() * games.length)];
  openGame(randomGame);
  showToast(`Loading random game: ${randomGame.name}`);
});

// Game Player Controls
function openGame(game) {
  document.getElementById('playerTitle').textContent = game.name;
  document.getElementById('gameFrame').src = game.link;
  const panel = document.getElementById('playerPanel');
  panel.hidden = false;
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('closeGameBtn').addEventListener('click', () => {
  document.getElementById('gameFrame').src = 'about:blank';
  document.getElementById('playerPanel').hidden = true;
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  const frameWrap = document.getElementById('playerFrameWrap');
  if (frameWrap.requestFullscreen) frameWrap.requestFullscreen();
  else if (frameWrap.webkitRequestFullscreen) frameWrap.webkitRequestFullscreen();
});

// Functional Settings Modal Logic
document.getElementById('settingsBtn').addEventListener('click', () => {
  settingsModal.classList.add('open');
});

document.getElementById('closeSettingsModal').addEventListener('click', () => {
  settingsModal.classList.remove('open');
});

settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) settingsModal.classList.remove('open');
});

// Settings Toggles
const snowToggle = document.getElementById('snowToggle');
snowToggle.checked = snowEnabled;
snowToggle.addEventListener('change', (e) => {
  snowEnabled = e.target.checked;
  localStorage.setItem('rulex_snow', snowEnabled);
  document.getElementById('snowCanvas').style.display = snowEnabled ? 'block' : 'none';
});

const perfToggle = document.getElementById('perfToggle');
perfToggle.checked = perfEnabled;
document.body.classList.toggle('low-end', perfEnabled);
perfToggle.addEventListener('change', (e) => {
  perfEnabled = e.target.checked;
  localStorage.setItem('rulex_perf', perfEnabled);
  document.body.classList.toggle('low-end', perfEnabled);
});

document.getElementById('clearFavsBtn').addEventListener('click', () => {
  favs = [];
  localStorage.removeItem('rulex_favs');
  renderGames();
  showToast("Favorites reset!");
});

// Snowfall Animation Logic
const canvas = document.getElementById('snowCanvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

const flakes = Array.from({ length: 45 }, () => ({
  x: Math.random() * width,
  y: Math.random() * height,
  r: Math.random() * 3 + 1,
  d: Math.random() * 1 + 0.5
}));

function drawSnow() {
  if (!snowEnabled || perfEnabled) {
    ctx.clearRect(0, 0, width, height);
    requestAnimationFrame(drawSnow);
    return;
  }
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
  ctx.beginPath();
  flakes.forEach(f => {
    ctx.moveTo(f.x, f.y);
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
    f.y += f.d;
    f.x += Math.sin(f.y / 30) * 0.5;
    if (f.y > height) {
      f.y = -10;
      f.x = Math.random() * width;
    }
  });
  ctx.fill();
  requestAnimationFrame(drawSnow);
}

// Initial Launch
renderGames();
drawSnow();
</script>
</body>
</html>
