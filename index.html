<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rulex Arcade</title>
<style>
:root {
  color-scheme: dark;
  --bg: #050505;
  --panel: #111;
  --panel-border: #292929;
  --text: #f5f5f5;
  --muted: #aaa;
  --accent: #ff4757;
  --accent-gold: #ffc107;
}

* { box-sizing: border-box; cursor: none !important; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

/* Custom Crosshair Cursor */
#customCrosshair {
  position: fixed;
  top: 0;
  left: 0;
  width: 24px;
  height: 24px;
  pointer-events: none;
  z-index: 999999;
  transform: translate(-50%, -50%);
}
#customCrosshair::before, #customCrosshair::after {
  content: '';
  position: absolute;
  background: #00ffff;
  box-shadow: 0 0 6px #00ffff;
}
#customCrosshair::before { left: 11px; top: 0; width: 2px; height: 24px; }
#customCrosshair::after { top: 11px; left: 0; width: 24px; height: 2px; }
#customCrosshair .dot {
  position: absolute;
  top: 9px;
  left: 9px;
  width: 6px;
  height: 6px;
  border: 1px solid #ff4757;
  border-radius: 50%;
}

/* Sparkle Canvas Overlay */
#sparkleCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 99998;
}

#intro {
  position: fixed; inset: 0; background: #000; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 1s ease; opacity: 1;
}
#brand {
  position: absolute; left: calc(50% + 50px); top: 50%;
  transform: translate(-50%,-50%); width: min(420px, 80vw);
  max-height: 50vh; object-fit: contain; transition: all 1.2s ease;
}
#loading {
  position: absolute; left: calc(50% + 30px); top: calc(50% + 133px);
  width: min(320px, 65vw); height: 6px; background: #242424;
  border-radius: 8px; overflow: hidden; opacity: 0; transition: opacity .4s;
}
#loadFill { height: 100%; width: 0; background: #fff; border-radius: 8px; }
#intro.done { opacity: 0; pointer-events: none; }
#intro.done #brand { left: 0; top: 0; transform: translate(20px,20px); width: 100px; max-height: 70px; }
#intro.done #loading { opacity: 0; }

#app { min-height: 100vh; padding: 24px 28px 100px; opacity: 0; transition: opacity .7s; }
#app.ready { opacity: 1; }

header { display: flex; align-items: center; gap: 16px; min-height: 72px; }
#smallLogo { width: 100px; height: 64px; object-fit: contain; visibility: hidden; }
header h1 { font-size: clamp(25px,4vw,38px); margin: 0; font-weight: 800; letter-spacing: -1px; }
header .sub { color: var(--muted); font-size: 13px; margin-top: 5px; }

/* Menu & Navigation */
#menu {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; z-index: 10; background: #121212;
  border: 1px solid #303030; padding: 10px 12px; border-radius: 18px;
  box-shadow: 0 8px 30px #000a;
}
.menuBtn {
  width: 48px; height: 48px; border: 0; border-radius: 12px;
  background: #f4f4f4; color: #050505; display: grid; place-items: center;
  transition: transform .15s, background .15s;
}
.menuBtn:hover { transform: translateY(-2px); background: #ddd; }
.menuBtn svg { width: 23px; height: 23px; fill: currentColor; }

/* Filter Tags */
.tags { display: flex; gap: 8px; overflow-x: auto; margin: 16px 0; padding-bottom: 6px; scrollbar-width: none; }
.tags::-webkit-scrollbar { display: none; }
.tag {
  background: #171717; border: 1px solid #333; color: #ccc;
  padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600;
  white-space: nowrap; transition: all .15s;
}
.tag.active, .tag:hover { background: #eee; color: #000; border-color: #eee; }
.tag[data-cat="Favorites"].active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Gallery & Grid */
#gallery { display: none; margin-top: 15px; }
#gallery.show { display: block; }
.galleryTop { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.galleryTop h2 { margin: 0; font-size: 25px; }
.galleryTop input {
  background: #111; border: 1px solid #333; border-radius: 10px; color: white;
  padding: 12px 14px; min-width: min(280px,100%); font-size: 14px; outline: none;
}
.galleryTop input:focus { border-color: #888; }

#gameGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 17px; }
.game {
  position: relative; border: 1px solid #262626; background: #101010;
  border-radius: 13px; overflow: hidden; transition: transform .16s, border-color .16s; min-width: 0;
}
.game:hover { transform: translateY(-4px); border-color: #777; }
.game img { width: 100%; height: 120px; display: block; object-fit: cover; background: #222; }
.game .gameName { font-size: 14px; font-weight: 700; padding: 12px 12px 14px; line-height: 1.3; }
.empty { color: #aaa; padding: 30px 0; }

/* Favorite Heart Button */
.favBtn {
  position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 50%;
  width: 32px; height: 32px; font-size: 16px; display: grid; place-items: center;
  z-index: 2; transition: transform .2s; line-height: 1;
}
.favBtn.active { color: var(--accent); background: #fff; }
.favBtn:hover { transform: scale(1.15); }

/* Player Panel */
#playerPanel { margin-top: 26px; }
#playerPanel[hidden] { display: none; }
.playerTop { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.playerTop h2 { margin: 0; font-size: 22px; }
.playerActions { display: flex; gap: 8px; flex-wrap: wrap; }
.playerActions button {
  background: #171717; border: 1px solid #444; color: #fff;
  border-radius: 9px; padding: 10px 13px; font-weight: 700;
}
.playerActions button:hover { background: #252525; }
#playerFrameWrap {
  width: 100%; height: min(72vh,760px); min-height: 360px;
  background: #000; border: 1px solid #333; border-radius: 12px; overflow: hidden;
}
#gameFrame { width: 100%; height: 100%; border: 0; background: #000; }
.embedNote { color: #aaa; font-size: 13px; margin-top: 10px; }

/* Settings Modal */
#settingsModal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(5px);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
#settingsModal.open { opacity: 1; pointer-events: auto; }
.modalCard {
  background: #111; border: 1px solid #333; border-radius: 18px; padding: 24px;
  width: min(420px, 90vw); box-shadow: 0 12px 40px #000;
}
.modalHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modalHeader h3 { margin: 0; font-size: 20px; }
.closeModalBtn { background: none; border: none; color: #888; font-size: 22px; }
.settingRow { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; }
.settingRow label { font-size: 14px; font-weight: 600; }
.switch { position: relative; display: inline-block; width: 44px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background-color: #333; transition: .2s; border-radius: 22px; }
.slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
input:checked + .slider { background-color: var(--accent-gold); }
input:checked + .slider:before { transform: translateX(22px); }

@media(max-width:600px){
  #app{padding:14px 14px 100px}
  #gameGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .game img{height:105px}
  .game .gameName{padding:10px;font-size:13px}
  #brand{left:50%;}
}
</style>
</head>
<body>

<!-- Custom Crosshair Cursor Element -->
<div id="customCrosshair"><div class="dot"></div></div>

<!-- Sparkle Canvas Overlay -->
<canvas id="sparkleCanvas"></canvas>

<div id="intro" aria-label="Rulex Arcade loading screen">
  <img id="brand" src="https://aidencarter3131.github.io/Rulex-Arcade/R-11-7-2026.png" alt="Rulex Arcade logo">
  <div id="loading"><div id="loadFill"></div></div>
</div>

<main id="app">
  <header>
    <img id="smallLogo" src="https://aidencarter3131.github.io/Rulex-Arcade/R-11-7-2026.png" alt="">
    <div>
      <h1>Rulex Arcade</h1>
      <div class="sub">Pick a game and have fun.</div>
    </div>
  </header>

  <section id="gallery" aria-label="Game library">
    <div class="galleryTop">
      <h2>Games</h2>
      <input id="search" type="search" placeholder="Search games…" aria-label="Search games">
    </div>

    <!-- Category Filter Tags -->
    <div class="tags" id="categoryTags">
      <button class="tag active" data-cat="All">All</button>
      <button class="tag" data-cat="Favorites">Favorites ♥</button>
      <button class="tag" data-cat="Sports">Sports</button>
      <button class="tag" data-cat="Action">Action</button>
      <button class="tag" data-cat="Rhythm">Rhythm</button>
      <button class="tag" data-cat="Casual">Casual</button>
    </div>

    <div id="gameGrid"></div>
    <div id="empty" class="empty" hidden>No games match your search.</div>
  </section>

  <section id="playerPanel" aria-label="Game player" hidden>
    <div class="playerTop">
      <h2 id="playerTitle">Game</h2>
      <div class="playerActions">
        <button id="fullscreenBtn" type="button">⛶ Fullscreen</button>
        <button id="closeGameBtn" type="button">✕ Back to games</button>
      </div>
    </div>
    <div id="playerFrameWrap">
      <iframe id="gameFrame" title="Game player" allow="autoplay; fullscreen; gamepad" allowfullscreen referrerpolicy="no-referrer"></iframe>
    </div>
    <p id="embedNote" class="embedNote" hidden>This game’s host may block being embedded. If it does not load here, that game may not support in-page play.</p>
  </section>
</main>

<nav id="menu" aria-label="Main menu">
  <button class="menuBtn" id="playBtn" title="Play" aria-label="Show games">
    <svg viewBox="0 0 24 24"><path d="M7 4.8c0-.8.9-1.3 1.6-.9l11 6.6a1.7 1.7 0 0 1 0 2.9l-11 6.6c-.7.4-1.6-.1-1.6-.9V4.8z"/></svg>
  </button>
  <button class="menuBtn" id="settingsBtn" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.5-2-3.5-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7.8 7.8 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7.7 7.7 0 0 0 1.7 1L11 21h4l.4-2.9a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.5-2.1-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
  </button>
</nav>

<!-- Functional Settings Modal -->
<div id="settingsModal">
  <div class="modalCard">
    <div class="modalHeader">
      <h3>Arcade Settings</h3>
      <button class="closeModalBtn" id="closeSettingsModal">&times;</button>
    </div>
    <div class="settingRow">
      <label for="sparkleToggle">Sparkle Effect & Sound</label>
      <label class="switch">
        <input type="checkbox" id="sparkleToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="settingRow">
      <label for="audioToggle">Startup Sound</label>
      <label class="switch">
        <input type="checkbox" id="audioToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<audio id="startupAudio" preload="auto" src="https://aidencarter3131.github.io/Rulex-Arcade/Microsoft%20Windows%20Vista%20Startup%20Sound.mp3"></audio>

const casualKw = ['candy crush', 'fruit ninja', 'run', 'slope', 'crossy road', 'hole.io', 'stack', 'dinosaur', 'jetpack'];

  const n = g.name.toLowerCase();

  else if (rhythmKw.some(k => n.includes(k))) g.category = 'Rhythm';
  else if (casualKw.some(k => n.includes(k))) g.category = 'Casual';
  else g.category = 'Action';
});

// Sparkle Effect & Web Audio Chime Sound
let audioCtx = null;
function playSparkleSound() {
  if (!sparklesEnabled || !soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, now);
    osc.frequency.exponentialRampToValueAtTime(2400, now + 0.12);
    
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start(now);
    osc.stop(now + 0.12);
  } catch(e) {}
}

// Sparkle Canvas Renderer
const sCanvas = document.getElementById('sparkleCanvas');
const sCtx = sCanvas.getContext('2d');
let particles = [];
sCanvas.width = window.innerWidth;
sCanvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  sCanvas.width = window.innerWidth;
  sCanvas.height = window.innerHeight;
});

function createSparkles(x, y) {
  if (!sparklesEnabled) return;
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: x + (Math.random() * 60 - 30),
      y: y + (Math.random() * 40 - 20),
      size: Math.random() * 4 + 2,
      speedY: -Math.random() * 2 - 0.5,
      speedX: (Math.random() - 0.5) * 1.5,
      life: 1,
      color: `hsl(${Math.random() * 60 + 40}, 100%, 75%)`
    });
  }
  playSparkleSound();
}

function renderSparkles() {
  sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.speedX;
    p.y += p.speedY;
    p.life -= 0.03;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    sCtx.fillStyle = p.color;
    sCtx.globalAlpha = p.life;
    sCtx.beginPath();
    sCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    sCtx.fill();
  }
  sCtx.globalAlpha = 1;
  requestAnimationFrame(renderSparkles);
}
renderSparkles();

// Render Games Grid with Favorites
function renderGames() {
  const term = search.value.trim().toLowerCase();
  const filtered = games.filter(g => {
    if (g.hide) return false;
    const matchesSearch = g.name.toLowerCase().includes(term);
    const matchesCat = currentCat === 'All' ? true :
                       currentCat === 'Favorites' ? favs.includes(g.name) :
                       g.category === currentCat;
    return matchesSearch && matchesCat;
  });

  grid.innerHTML = filtered.map(g => `
    <article class="game" tabindex="0" role="link" aria-label="Play ${g.name}" data-name="${g.name}">
      <button class="favBtn ${favs.includes(g.name) ? 'active' : ''}" data-name="${g.name}" aria-label="Favorite">
        ${favs.includes(g.name) ? '♥' : '♡'}
      </button>
      <img src="${g.image}" alt="" loading="lazy" onerror="this.style.display='none'">
      <div class="gameName">${g.name}</div>
    </article>
  `).join('');

  empty.hidden = filtered.length > 0;
  
  // Attach Sparkle Hover listeners
  document.querySelectorAll('.game').forEach(card => {
    card.addEventListener('mouseenter', (e) => {
      const rect = card.getBoundingClientRect();
      createSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2);
    });
  });
}

// Event Delegation for Card Clicks & Favorites Toggle
grid.addEventListener('click', (e) => {
  const favBtn = e.target.closest('.favBtn');
  if (favBtn) {
    const name = favBtn.dataset.name;
    if (favs.includes(name)) favs = favs.filter(f => f !== name);
    else favs.push(name);
    localStorage.setItem('rulex_favs', JSON.stringify(favs));
    
    favBtn.textContent = favs.includes(name) ? '♥' : '♡';
    favBtn.classList.toggle('active', favs.includes(name));
    if (currentCat === 'Favorites') renderGames();
    return;
  }

  const card = e.target.closest('.game');
  if (card) {
    const game = games.find(g => g.name === card.dataset.name);
    if (game) openGame(game);
  }
});

// Category Tag Navigation

  if (e.target.classList.contains('tag')) {
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentCat = e.target.dataset.cat;
    renderGames();
  }
});

function showGames() {
  gallery.hidden = false;
  gallery.classList.add('show');
  renderGames();
  gallery.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function openGame(game) {
  if (!game || !game.link) return;
  const panel = document.getElementById('playerPanel');
  const frame = document.getElementById('gameFrame');
  document.getElementById('playerTitle').textContent = game.name;
  document.getElementById('embedNote').hidden = false;

  if (game.link === 'custom_sonic_cd') {
    frame.srcdoc = sonicCdHtml;
  } else {
    let url;
    try { url = new URL(game.link, window.location.href); } catch { return; }
    frame.removeAttribute('srcdoc');
    frame.src = url.href;
  }

  panel.hidden = false;
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeGame() {
  const frame = document.getElementById('gameFrame');
  frame.src = 'about:blank';
  frame.removeAttribute('srcdoc');
  document.getElementById('playerPanel').hidden = true;
  gallery.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('closeGameBtn').addEventListener('click', closeGame);
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  const target = document.getElementById('playerFrameWrap');
  if (target.requestFullscreen) target.requestFullscreen().catch(() => {});
  else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
});

sparkleToggle.checked = sparklesEnabled;
sparkleToggle.addEventListener('change', (e) => {
  sparklesEnabled = e.target.checked;
  localStorage.setItem('rulex_sparkles', sparklesEnabled);

const audioToggle = document.getElementById('audioToggle');

audioToggle.addEventListener('change', (e) => {
  soundEnabled = e.target.checked;
  localStorage.setItem('rulex_sound', soundEnabled);
  document.getElementById('startupAudio').muted = !soundEnabled;

// Branded Intro Sequence
function beginIntro() {
  const loading = document.getElementById('loading');
  const audio = document.getElementById('startupAudio');
  setTimeout(() => { loading.style.opacity = '1'; fill.style.transition = 'width 3.5s ease'; fill.style.width = '100%'; }, 900);
  setTimeout(() => { if (soundEnabled) { audio.volume = .55; audio.play().catch(() => {}); } }, 4000);
  setTimeout(() => {
    document.getElementById('brand').style.left = '0';
    document.getElementById('brand').style.top = '0';
    document.getElementById('brand').style.transform = 'translate(20px,20px)';
    document.getElementById('brand').style.width = '100px';
    document.getElementById('brand').style.maxHeight = '70px';
    document.getElementById('smallLogo').style.visibility = 'visible';
    app.classList.add('ready');
  }, 8000);
  setTimeout(() => { intro.classList.add('done'); }, 9500);
}
